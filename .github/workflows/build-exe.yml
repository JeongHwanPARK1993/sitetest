name: 업무보조 달력 exe 만들기

on:
  push:
    branches: [claude/official-calendar-folder-setup-cd0u0p]
    paths:
      - "공문달력ver/달력/**"
      - "공문달력ver/검증/**"
      - "공문달력ver/병아리대원/**"
      - "공문달력ver/사용설명.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 공문 분석 시험 (여러 경우의 수)
        run: python 공문달력ver/검증/분석시험.py

      - name: Install
        run: pip install pyinstaller==6.11.1

      - name: Build exe (폴더형 - 켜지는 속도가 빠름)
        working-directory: 공문달력ver/달력
        run: >
          pyinstaller --noconfirm --onedir --windowed --name GongmunCalendar
          --icon icon.ico --add-data "icon.png;." --add-data "icon.ico;."
          --hidden-import gongmun_xlsx --hidden-import gongmun_pdf --hidden-import gongmun_system
          --hidden-import gongmun_rename --hidden-import gongmun_kcal
          --exclude-module ssl --exclude-module _ssl --exclude-module _hashlib
          --exclude-module bz2 --exclude-module _bz2 --exclude-module lzma --exclude-module _lzma
          --exclude-module decimal --exclude-module _decimal --exclude-module unittest --exclude-module pydoc
          --exclude-module doctest --exclude-module xmlrpc --exclude-module http --exclude-module email
          --exclude-module sqlite3 --exclude-module asyncio --exclude-module multiprocessing
          --exclude-module pypdf --exclude-module pdfplumber
          gongmun_calendar.py

      - name: Build 병아리대원
        run: dotnet build 공문달력ver/병아리대원/chick.csproj -c Release -o chick_out

      - name: 병아리대원 시험 (달력 질문을 받아 대답하는지)
        shell: python
        run: |
          import os, subprocess, time, sys, shutil
          exe = os.path.abspath(os.path.join("chick_out", "병아리대원.exe"))
          root = os.path.join(os.environ["APPDATA"], "병아리대원")
          d = os.path.join(root, "달력연결")
          os.makedirs(d, exist_ok=True)
          with open(os.path.join(d, "inbox.txt"), "w", encoding="utf-8") as f:
              f.write("test~D-1~0~000000\t삐약! 시험 질문이에요. 확인했어요?\n")
          p = subprocess.Popen([exe])
          time.sleep(80)                      # 말풍선은 60초 동안 대답이 없으면 닫히고 'ignore' 를 적는다
          alive = p.poll() is None
          out = os.path.join(d, "outbox.txt")
          ans = open(out, encoding="utf-8-sig").read() if os.path.exists(out) else ""
          err = os.path.join(root, "error.log")
          errs = open(err, encoding="utf-8-sig").read() if os.path.exists(err) else ""
          print("alive:", alive, "| outbox:", repr(ans), "| error.log:", errs[:3000])
          p.kill()
          shutil.rmtree(root, ignore_errors=True)
          if not alive or "test~D-1~0~000000\tignore" not in ans or errs:
              sys.exit(1)

      - name: Self test on Windows
        shell: python
        run: |
          import os, shutil, subprocess, sys
          dist = os.path.join("공문달력ver", "달력", "dist", "GongmunCalendar")
          os.replace(os.path.join(dist, "GongmunCalendar.exe"), os.path.join(dist, "업무보조달력.exe"))
          os.makedirs(os.path.join(dist, "병아리대원"), exist_ok=True)
          for f in ("병아리대원.exe", "병아리대원.exe.config"):
              shutil.copy2(os.path.join("chick_out", f), os.path.join(dist, "병아리대원", f))
          test = os.path.join(os.environ["RUNNER_TEMP"], "selftest_app")
          shutil.copytree(dist, test)
          subprocess.run([os.path.join(test, "업무보조달력.exe"), "--selftest"], timeout=300)
          log = open(os.path.join(test, "selftest.log"), encoding="utf-8").read()
          print(log)
          if not log.rstrip().endswith("OK"):
              sys.exit(1)

      - name: Zip
        shell: python
        run: |
          import os, zipfile
          dist = os.path.join("공문달력ver", "달력", "dist", "GongmunCalendar")
          os.makedirs(os.path.join("공문달력ver", "배포"), exist_ok=True)
          out = os.path.join("공문달력ver", "배포", "업무보조달력.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for root, _, files in os.walk(dist):
                  for f in files:
                      full = os.path.join(root, f)
                      z.write(full, os.path.join("업무보조달력", os.path.relpath(full, dist)))
              z.write(os.path.join("공문달력ver", "사용설명.txt"), "업무보조달력/사용설명.txt")
          print(out, os.path.getsize(out))

      - uses: actions/upload-artifact@v4
        with:
          name: 업무보조달력
          path: 공문달력ver/배포/업무보조달력.zip

      - name: Commit zip
        shell: bash
        run: |
          git config core.quotepath false
          git config user.name "github-actions[bot]"
          git config user.email "41898277+github-actions[bot]@users.noreply.github.com"
          git add 공문달력ver/배포/업무보조달력.zip
          git commit -m "업무보조달력 exe 빌드 결과 (자동)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
